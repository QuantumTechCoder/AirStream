name: 🐛 Bug Report
description: Create a report to help us improve AirStream
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you've checked existing issues before filing a new one.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: e.g. Chrome 124 on macOS, Firefox 125 on Windows 11, Safari on iOS 17
      placeholder: Chrome 124 on macOS Sonoma
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps on how to reproduce the issue.
      placeholder: |
        1. Pair device A and device B using code
        2. Drag 2GB file into Drop Zone
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
